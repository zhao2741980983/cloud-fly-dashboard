<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="云资源数据可视化大屏：展示国家统计局 GDP 与空气质量数据" />
    <meta name="theme-color" content="#0b1424" />
    <title>云资源数据可视化大屏</title>
    <style>
      /* 首屏底色：脚本加载完成前也是深色，避免白屏闪一下 */
      html,
      body {
        margin: 0;
        background-color: #0b1424;
        color: #fff;
      }
      /* 脚本尚未加载时的启动动画，Vue 挂载后会被自动替换掉 */
      .boot-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        color: #8fa3bf;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        font-size: 14px;
        letter-spacing: 1px;
      }
      .boot-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(143, 163, 191, 0.25);
        border-top-color: #4a90e2;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <span class="boot-spinner"></span>
        <span>正在加载大屏…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
